services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: streamhub
      POSTGRES_DB: streamhub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub -d streamhub"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://streamhub:streamhub@postgres:5432/streamhub?sslmode=disable
      SRS_API_URL: http://srs:1985
      SRS_HLS_URL: http://srs:8080
      SRS_TS_API_URL: http://srs-ts:1985
      TOKEN_KEY: ${TOKEN_KEY}
      HOOK_SECRET: ${HOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-20}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-5m}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TOKEN_TTL: ${TOKEN_TTL:-5m}
      HLS_TOKEN_TTL: ${HLS_TOKEN_TTL:-6h}
      EDGE_TS_BASE_URL: ${EDGE_TS_BASE_URL}
      EDGE_HLS_BASE_URL: ${EDGE_HLS_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  srs:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"

  srs-ts:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs-ts.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    ports:
      - "8081:8080"

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    profiles: ["e2e"]

volumes:
  pgdata:
