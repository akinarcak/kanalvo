# Proje adı COMPOSE_PROJECT_NAME ile, dış portlar KANALVO_*_PORT değişkenleriyle değiştirilebilir
# (bkz. docs/simulasyon.md); böylece simülasyon ortamı çalışan bir geliştirme ortamının yanında kalkar.
name: kanalvo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanalvo
      POSTGRES_PASSWORD: kanalvo
      POSTGRES_DB: kanalvo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${KANALVO_PG_PORT:-5432}:5432"
    healthcheck:
      # 127.0.0.1: ilk kurulumda veritabanını hazırlayan geçici sunucu ağdan dinlemez; onu "hazır" saymayız.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kanalvo -d kanalvo"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://kanalvo:kanalvo@postgres:5432/kanalvo?sslmode=disable
      SRS_API_URL: http://srs:1985
      SRS_HLS_URL: http://srs:8080
      SRS_TS_API_URL: http://srs-ts:1985
      TOKEN_KEY: ${TOKEN_KEY}
      HOOK_SECRET: ${HOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      INGEST_BASE_URL: ${INGEST_BASE_URL}
      # Panel yalnızca caddy servisinin arkasından, HTTPS ile sunulur: çerez Secure'dur ve istemcinin
      # adresi Caddy'nin yazdığı X-Forwarded-For'dan okunur (bkz. deploy/caddy/Caddyfile).
      PANEL_INSECURE_COOKIE: ${PANEL_INSECURE_COOKIE:-false}
      PANEL_TRUST_PROXY_HEADERS: ${PANEL_TRUST_PROXY_HEADERS:-true}
      PANEL_SESSION_TTL: ${PANEL_SESSION_TTL:-12h}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-20}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-5m}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TOKEN_TTL: ${TOKEN_TTL:-5m}
      HLS_TOKEN_TTL: ${HLS_TOKEN_TTL:-6h}
      EDGE_TS_BASE_URL: ${EDGE_TS_BASE_URL}
      EDGE_HLS_BASE_URL: ${EDGE_HLS_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KANALVO_API_PORT:-8000}:8000"
      # Panel dışarıya yalnızca caddy'den (HTTPS) açılır. Düz HTTP portu yalnızca bu makineden
      # erişilir (arayüz geliştirme sunucusu, yerel denetim).
      - "${KANALVO_PANEL_BIND:-127.0.0.1}:${KANALVO_PANEL_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Panelin HTTPS'li ters vekili. PANEL_DOMAIN gerçek bir alan adıysa sertifikayı ACME ile alır;
  # verilmezse localhost ve Caddy'nin iç CA'sı kullanılır (bkz. deploy/caddy/Caddyfile).
  caddy:
    image: caddy:2.11.1-alpine
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 80: ACME doğrulaması ve HTTPS'e yönlendirme; 443: panel.
      - "${KANALVO_HTTP_PORT:-80}:80"
      - "${KANALVO_HTTPS_PORT:-443}:443"
    healthcheck:
      # Yalnızca Caddy'nin ayakta olduğuna bakar; ACME sertifikasının gecikmesi kurulumu bekletmez.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 30

  srs:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KANALVO_RTMP_PORT:-1935}:1935"

  srs-ts:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs-ts.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    ports:
      - "${KANALVO_TS_PORT:-8081}:8080"

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    profiles: ["e2e"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
