services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: streamhub
      POSTGRES_DB: streamhub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub -d streamhub"]
      interval: 2s
      timeout: 3s
      retries: 30

  srs:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"
      - "127.0.0.1:1985:1985"

  srs-ts:
    image: ossrs/srs:5
    environment:
      HOOK_BASE: ${HOOK_BASE}
    volumes:
      - ./deploy/srs/srs-ts.conf.tmpl:/conf/srs.conf.tmpl:ro
    command:
      - sh
      - -c
      - sed "s|__HOOK_BASE__|$$HOOK_BASE|g" /conf/srs.conf.tmpl > /tmp/srs.conf && exec ./objs/srs -c /tmp/srs.conf
    ports:
      - "8081:8080"

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    profiles: ["e2e"]

volumes:
  pgdata:
