# Uçtan uca test için: edge'i ana sunucunun Compose ağına bağlar; böylece aynı makinede "ikinci
# sunucu" gibi çalışır. Gerçek kurulumda kullanılmaz.
services:
  edge-srs:
    networks: [default, kanalvo]
  edge-nginx:
    networks: [default, kanalvo]

networks:
  kanalvo:
    external: true
    name: kanalvo_default
